name: Build and Push API

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: carspecsregistry.azurecr.io
  IMAGE_NAME: carspec-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Azure using OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Login to Azure Container Registry
      - name: Login to ACR
        run: |
          az acr login --name carspecsregistry

      # 4. Build Docker image
      - name: Build API Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            ./CarSpecAPI

      # 5. Push image to ACR
      - name: Push API image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}