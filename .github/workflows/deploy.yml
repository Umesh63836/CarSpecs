name: Build and Deploy API

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: carspecsregistry.azurecr.io

  API_IMAGE: carspec-api
  FRONTEND_IMAGE: carspec-frontend

  RESOURCE_GROUP: carspec-rg

  API_CONTAINER_APP: carspec-api
  FRONTEND_CONTAINER_APP: carspec-frontend

  CONTAINER_ENVIRONMENT: carspec-env

  IDENTITY_NAME: carspec-api-identity

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ---------------- CI ----------------

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name carspecsregistry

      # -------- Build & Push API --------

      - name: Build API Docker image
        run: |
          docker build \
            -t $REGISTRY/$API_IMAGE:${{ github.sha }} \
            ./CarSpecAPI

      - name: Push API image
        run: |
          docker push $REGISTRY/$API_IMAGE:${{ github.sha }}

      # ------ Build & Push Frontend ------

      - name: Build Angular Docker image
        run: |
          docker build \
            -t $REGISTRY/$FRONTEND_IMAGE:${{ github.sha }} \
            ./CarSpecAngular/carspec

      - name: Push Angular image
        run: |
          docker push $REGISTRY/$FRONTEND_IMAGE:${{ github.sha }}

      # ---------------- CD ----------------

      - name: Get managed identity ID
        id: identity
        run: |
          IDENTITY_ID=$(az identity show \
            --name $IDENTITY_NAME \
            --resource-group $RESOURCE_GROUP \
            --query id \
            --output tsv)

          echo "identity_id=$IDENTITY_ID" >> $GITHUB_OUTPUT

      # -------- Check API Container App --------

      - name: Check API Container App
        id: check-api
        run: |
          if az containerapp show \
            --name $API_CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            > /dev/null 2>&1; then

            echo "exists=true" >> $GITHUB_OUTPUT

          else

            echo "exists=false" >> $GITHUB_OUTPUT

          fi

      # -------- First API deployment --------

      - name: Create API Container App
        if: steps.check-api.outputs.exists == 'false'
        run: |
          az containerapp create \
            --name $API_CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --environment $CONTAINER_ENVIRONMENT \
            --image $REGISTRY/$API_IMAGE:${{ github.sha }} \
            --target-port 8080 \
            --ingress external \
            --user-assigned ${{ steps.identity.outputs.identity_id }} \
            --registry-server $REGISTRY \
            --registry-identity ${{ steps.identity.outputs.identity_id }}

      # -------- Subsequent API deployments --------

      - name: Update API Container App
        if: steps.check-api.outputs.exists == 'true'
        run: |
          az containerapp update \
            --name $API_CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $REGISTRY/$API_IMAGE:${{ github.sha }}

      # -------- Update Frontend --------

      - name: Update Frontend Container App
        run: |
          az containerapp update \
            --name $FRONTEND_CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $REGISTRY/$FRONTEND_IMAGE:${{ github.sha }}