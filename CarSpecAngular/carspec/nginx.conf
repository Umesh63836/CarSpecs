server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    types {
        text/javascript mjs;
        application/javascript js;
    }

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
    proxy_pass https://carspec-api.delightfulhill-4da930f8.centralindia.azurecontainerapps.io;
    proxy_connect_timeout 60s;
    proxy_send_timeout 500s;
    proxy_read_timeout 500s;

    proxy_http_version 1.1;

    proxy_set_header Host carspec-api.delightfulhill-4da930f8.centralindia.azurecontainerapps.io;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_ssl_server_name on;
    proxy_ssl_name carspec-api.delightfulhill-4da930f8.centralindia.azurecontainerapps.io;
    }
}