server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    client_max_body_size 50M;

    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://carspec-api.delightfulhill-4da9308f.centralindia.azurecontainerapps.io;

        proxy_connect_timeout 60s;
        proxy_send_timeout 500s;
        proxy_read_timeout 500s;

        proxy_http_version 1.1;

        proxy_set_header Host carspec-api.delightfulhill-4da9308f.centralindia.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_server_name on;
        proxy_ssl_name carspec-api.delightfulhill-4da9308f.centralindia.azurecontainerapps.io;
    }
}