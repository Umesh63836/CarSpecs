<div class="min-h-screen bg-gray-50">

  <!-- Hero -->

  <section
    class="px-4 pb-16 pt-16 sm:pt-20"
  >

    <div
      class="mx-auto max-w-5xl text-center"
    >

      <h1
        class="text-4xl font-bold tracking-tight
               text-gray-900 sm:text-5xl"
      >
        Find the right car for you
      </h1>

      <p
        class="mx-auto mt-4 max-w-2xl
               text-base text-gray-500 sm:text-lg"
      >
        Explore cars by price, power, fuel,
        transmission and more.
      </p>


      <!-- Quick filters -->

      <div class="mt-8">

        <p
          class="mb-3 text-sm font-semibold
                 text-gray-700"
        >
          Popular filters
        </p>


        <div
          class="flex flex-wrap justify-center
                 gap-3"
        >

          <!-- Under 10 lakh -->

          <button
            type="button"
            (click)="applyQuickFilter({
              maxPrice: 10
            })"
            class="rounded-full
                   border border-gray-200
                   bg-white px-5 py-2.5
                   text-sm font-medium
                   text-gray-700
                   shadow-sm
                   transition
                   hover:-translate-y-0.5
                   hover:border-black
                   hover:shadow-md"
          >
            Under ₹10 Lakh
          </button>


          <!-- 70+ PS -->

          <button
            type="button"
            (click)="applyQuickFilter({
              minPower: 70
            })"
            class="rounded-full
                   border border-gray-200
                   bg-white px-5 py-2.5
                   text-sm font-medium
                   text-gray-700
                   shadow-sm
                   transition
                   hover:-translate-y-0.5
                   hover:border-black
                   hover:shadow-md"
          >
            70+ PS
          </button>


          <!-- Petrol -->

          <button
            type="button"
            (click)="applyQuickFilter({
              fuelType: 'Petrol'
            })"
            class="rounded-full
                   border border-gray-200
                   bg-white px-5 py-2.5
                   text-sm font-medium
                   text-gray-700
                   shadow-sm
                   transition
                   hover:-translate-y-0.5
                   hover:border-black
                   hover:shadow-md"
          >
            Petrol
          </button>


          <!-- Automatic -->

          <button
            type="button"
            (click)="applyQuickFilter({
              transmissionType: 'Automatic'
            })"
            class="rounded-full
                   border border-gray-200
                   bg-white px-5 py-2.5
                   text-sm font-medium
                   text-gray-700
                   shadow-sm
                   transition
                   hover:-translate-y-0.5
                   hover:border-black
                   hover:shadow-md"
          >
            Automatic
          </button>


          <!-- SUV -->

          <button
            type="button"
            (click)="applyQuickFilter({
              drivetrainType: 'AWD'
            })"
            class="rounded-full
                   border border-gray-200
                   bg-white px-5 py-2.5
                   text-sm font-medium
                   text-gray-700
                   shadow-sm
                   transition
                   hover:-translate-y-0.5
                   hover:border-black
                   hover:shadow-md"
          >
            AWD
          </button>


          <!-- All Filters -->

          <button
            type="button"
            (click)="openFilterPopup()"
            class="rounded-full
                   bg-gray-200 px-5 py-2.5
                   text-sm font-semibold
                   text-black
                   shadow-sm
                   transition
                   hover:-translate-y-0.5
                   hover:bg-black-800
                   hover:shadow-md"
          >
            + All Filters
          </button>

        </div>

      </div>

    </div>

  </section>


  <!-- Filter Popup -->

  @if (showFilterPopup) {

    <!-- Backdrop -->

    <div
      class="fixed inset-0 z-[9998]
             bg-black/40
             backdrop-blur-sm"
      (click)="closeFilterPopup()"
    ></div>


    <!-- Modal -->

    <div
      class="fixed inset-0 z-[9999]
             flex items-center
             justify-center
             p-4"
    >

      <div
        class="w-full max-w-2xl
               max-h-[90vh]
               overflow-y-auto
               rounded-2xl
               bg-white
               shadow-2xl"
        (click)="$event.stopPropagation()"
      >

        <!-- Header -->

        <div
          class="sticky top-0 z-10
                 flex items-center
                 justify-between
                 border-b
                 border-gray-200
                 bg-white
                 px-6 py-4"
        >

          <div>

            <h2
              class="text-lg font-bold
                     text-gray-900"
            >
              Filter Cars
            </h2>

            <p
              class="text-xs text-gray-500"
            >
              Choose your preferences
            </p>

          </div>


          <button
            type="button"
            (click)="closeFilterPopup()"
            class="flex h-9 w-9
                   items-center justify-center
                   rounded-full
                   text-xl text-gray-500
                   transition
                   hover:bg-gray-100
                   hover:text-gray-900"
          >
            ×
          </button>

        </div>


        <!-- Filters -->

        <div
          class="grid gap-5
                 px-6 py-6
                 sm:grid-cols-2"
        >

          <!-- Brand -->

          <div>

            <label
              class="mb-1.5 block
                     text-sm font-medium"
            >
              Brand
            </label>

            <input
              type="text"
              [(ngModel)]="filters.brand"
              placeholder="e.g. Hyundai"
              class="w-full rounded-lg
                     border border-gray-300
                     px-3 py-2.5 text-sm
                     outline-none
                     focus:border-black"
            />

          </div>


          <!-- Model -->

          <div>

            <label
              class="mb-1.5 block
                     text-sm font-medium"
            >
              Model
            </label>

            <input
              type="text"
              [(ngModel)]="filters.model"
              placeholder="e.g. Creta"
              class="w-full rounded-lg
                     border border-gray-300
                     px-3 py-2.5 text-sm
                     outline-none
                     focus:border-black"
            />

          </div>


          <!-- Min Price -->

          <div>

            <label
              class="mb-1.5 block
                     text-sm font-medium"
            >
              Minimum Price
            </label>

            <input
              type="number"
              [(ngModel)]="filters.minPrice"
              placeholder="₹ Minimum"
              class="w-full rounded-lg
                     border border-gray-300
                     px-3 py-2.5 text-sm"
            />

          </div>


          <!-- Max Price -->

          <div>

            <label
              class="mb-1.5 block
                     text-sm font-medium"
            >
              Maximum Price
            </label>

            <input
              type="number"
              [(ngModel)]="filters.maxPrice"
              placeholder="₹ Maximum"
              class="w-full rounded-lg
                     border border-gray-300
                     px-3 py-2.5 text-sm"
            />

          </div>


          <!-- Min Power -->

          <div>

            <label
              class="mb-1.5 block
                     text-sm font-medium"
            >
              Minimum Power (PS)
            </label>

            <input
              type="number"
              [(ngModel)]="filters.minPower"
              placeholder="e.g. 70"
              class="w-full rounded-lg
                     border border-gray-300
                     px-3 py-2.5 text-sm"
            />

          </div>


          <!-- Max Power -->

          <div>

            <label
              class="mb-1.5 block
                     text-sm font-medium"
            >
              Maximum Power (PS)
            </label>

            <input
              type="number"
              [(ngModel)]="filters.maxPower"
              placeholder="e.g. 150"
              class="w-full rounded-lg
                     border border-gray-300
                     px-3 py-2.5 text-sm"
            />

          </div>


          <!-- Min Torque -->

          <div>

            <label
              class="mb-1.5 block
                     text-sm font-medium"
            >
              Minimum Torque (Nm)
            </label>

            <input
              type="number"
              [(ngModel)]="filters.minTorque"
              placeholder="e.g. 150"
              class="w-full rounded-lg
                     border border-gray-300
                     px-3 py-2.5 text-sm"
            />

          </div>


          <!-- Max Torque -->

          <div>

            <label
              class="mb-1.5 block
                     text-sm font-medium"
            >
              Maximum Torque (Nm)
            </label>

            <input
              type="number"
              [(ngModel)]="filters.maxTorque"
              placeholder="e.g. 300"
              class="w-full rounded-lg
                     border border-gray-300
                     px-3 py-2.5 text-sm"
            />

          </div>


          <!-- Displacement -->

          <div>

            <label
              class="mb-1.5 block
                     text-sm font-medium"
            >
              Engine Displacement (cc)
            </label>

            <input
              type="number"
              [(ngModel)]="filters.displacement"
              placeholder="e.g. 1197"
              class="w-full rounded-lg
                     border border-gray-300
                     px-3 py-2.5 text-sm"
            />

          </div>


          <!-- Fuel -->

          <div>

            <label
              class="mb-1.5 block
                     text-sm font-medium"
            >
              Fuel Type
            </label>

            <select
              [(ngModel)]="filters.fuelType"
              class="w-full rounded-lg
                     border border-gray-300
                     bg-white px-3 py-2.5
                     text-sm"
            >

              <option [ngValue]="undefined">
                Any
              </option>

              <option value="Petrol">
                Petrol
              </option>

              <option value="Diesel">
                Diesel
              </option>

              <option value="CNG">
                CNG
              </option>

            </select>

          </div>


          <!-- Transmission -->

          <div>

            <label
              class="mb-1.5 block
                     text-sm font-medium"
            >
              Transmission
            </label>

            <select
              [(ngModel)]="filters.transmissionType"
              class="w-full rounded-lg
                     border border-gray-300
                     bg-white px-3 py-2.5
                     text-sm"
            >

              <option [ngValue]="undefined">
                Any
              </option>

              <option value="Manual">
                Manual
              </option>

              <option value="Automatic">
                Automatic
              </option>

              <option value="AMT">
                AMT
              </option>

              <option value="CVT">
                CVT
              </option>

              <option value="DCT">
                DCT
              </option>

            </select>

          </div>


          <!-- Gears -->

          <div>

            <label
              class="mb-1.5 block
                     text-sm font-medium"
            >
              Number of Gears
            </label>

            <input
              type="number"
              [(ngModel)]="filters.numberOfGears"
              placeholder="e.g. 6"
              class="w-full rounded-lg
                     border border-gray-300
                     px-3 py-2.5 text-sm"
            />

          </div>


          <!-- Drivetrain -->

          <div>

            <label
              class="mb-1.5 block
                     text-sm font-medium"
            >
              Drivetrain
            </label>

            <select
              [(ngModel)]="filters.drivetrainType"
              class="w-full rounded-lg
                     border border-gray-300
                     bg-white px-3 py-2.5
                     text-sm"
            >

              <option [ngValue]="undefined">
                Any
              </option>

              <option value="FWD">
                FWD
              </option>

              <option value="RWD">
                RWD
              </option>

              <option value="AWD">
                AWD
              </option>

              <option value="4WD">
                4WD
              </option>

            </select>

          </div>


          <!-- Turbo -->

          <div
            class="flex items-center
                   rounded-lg border
                   border-gray-200
                   px-4 py-3"
          >

            <label
              class="flex cursor-pointer
                     items-center gap-3"
            >

              <input
                type="checkbox"
                [(ngModel)]="filters.isTurbocharged"
                class="h-4 w-4"
              />

              <span class="text-sm font-medium">
                Turbocharged
              </span>

            </label>

          </div>

        </div>


        <!-- Footer -->

        <div
          class="sticky bottom-0
                 flex justify-between
                 gap-3 border-t
                 border-gray-200
                 bg-white px-6 py-4"
        >

          <button
            type="button"
            (click)="clearFilters()"
            class="rounded-lg
                   border border-gray-300
                   px-5 py-2.5
                   text-sm font-medium
                   text-gray-700
                   hover:bg-gray-50"
          >
            Clear
          </button>


          <button
            type="button"
            (click)="applyManualFilters()"
            class="rounded-lg
                   bg-black px-6 py-2.5
                   text-sm font-semibold
                   text-white
                   hover:bg-gray-800"
          >
            Show Cars
          </button>

        </div>

      </div>

    </div>

  }

</div>
