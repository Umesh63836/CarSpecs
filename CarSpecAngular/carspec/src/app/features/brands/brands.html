
@if (authService.isloggedout(); as success) {

  <div
    class="fixed top-5 right-5 z-[10000]
           w-[360px]
           rounded-xl
           border border-green-200
           bg-white
           p-4
           shadow-2xl
           animate-[slideIn_0.3s_ease-out]"
  >

    <div class="flex items-start gap-3">

      <!-- Success Icon -->
      <div
        class="flex h-10 w-10 shrink-0
               items-center justify-center
               rounded-full
               bg-green-100
               text-green-600"
      >
        ✓
      </div>

      <!-- Success Content -->
      <div class="flex-1">

        <h3 class="text-sm font-semibold text-gray-900">
          Logged out
        </h3>

        <!-- <p class="mt-1 text-sm text-gray-600">
          Logged out
        </p> -->

      </div>

      <!-- Close -->
      <button
        type="button"
        (click)="authService.isloggedout.set(false)"
        class="text-gray-400 transition-colors
               hover:text-gray-700"
      >
        ✕
      </button>

    </div>

  </div>

}


<div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8 lg:py-14">

  <!-- Title -->
  <div class="mx-auto mb-8 max-w-2xl text-center md:mb-12">

    <h2 class="text-2xl font-bold tracking-tight text-gray-900 md:text-3xl">
      Find Your Favourite Brand
    </h2>

    <p class="mt-2 text-sm text-gray-500 md:text-base">
      Explore cars from your favourite automobile brands
    </p>

  </div>
  <!-- End Title -->


  <!-- Brands Section -->
<!-- Brands Section -->
<div>

  <!-- Brands Grid -->
  <div
    class="grid grid-cols-4 gap-x-2 gap-y-2 overflow-hidden
           max-h-[218px] transition-[max-height] duration-300 ease-out
           sm:grid-cols-4 sm:gap-x-3 sm:gap-y-3 sm:max-h-[242px]
           md:grid-cols-5 md:gap-x-4 md:gap-y-4 md:max-h-[276px]
           lg:grid-cols-6
           xl:grid-cols-7"
    [class.!max-h-[5000px]]="brandsExpanded()"
  >

    @for (brand of brands(); track brand.brandId) {

      <a
        [routerLink]="['/models', brand.brandId]"
        class="group flex min-h-[105px] flex-col items-center justify-center
               rounded-xl bg-white p-2
               transition-all duration-300
               hover:-translate-y-1 hover:shadow-lg hover:shadow-gray-200/60
               sm:min-h-[115px] sm:p-3
               md:min-h-[130px] md:p-3"
      >

        <!-- Logo -->
        <div class="flex h-14 w-full items-center justify-center sm:h-16 md:h-18">

          <img
            [src]="brand.logoUrl"
            [alt]="brand.brandName"
            class="max-h-10 max-w-[70px] object-contain
                   transition-transform duration-300
                   group-hover:scale-110
                   sm:max-h-11 sm:max-w-[80px]
                   md:max-h-13 md:max-w-[95px]"
          >

        </div>

        <!-- Brand Name -->
        <div class="mt-2 text-center sm:mt-3">

          <h3
            class="text-[11px] font-semibold text-gray-800
                   transition-colors duration-200
                   group-hover:text-gray-950
                   sm:text-xs md:text-sm"
          >
            {{ brand.brandName }}
          </h3>

          <p
            class="mt-0.5 hidden text-[10px] font-medium text-gray-400
                   opacity-0 transition-opacity duration-200
                   group-hover:opacity-100 md:block"
          >
            View models →
          </p>

        </div>

      </a>

    }

  </div>


  <!-- Expand / Collapse -->
  @if (brands().length > 8) {

    <div class="mt-1 flex justify-center">

      <button
        type="button"
        (click)="brandsExpanded.set(!brandsExpanded())"
        class="flex h-8 w-8 items-center justify-center
               rounded-full text-gray-600
               transition-colors duration-200
               hover:bg-gray-100 hover:text-gray-900"
        [attr.aria-label]="brandsExpanded() ? 'Show fewer brands' : 'Show all brands'"
      >

        <svg
          class="h-4 w-4 transition-transform duration-200"
          [class.rotate-180]="brandsExpanded()"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 9l6 6 6-6"/>
        </svg>

      </button>

    </div>

  }

</div>

</div>
