<div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8 lg:py-14">

  <!-- Title -->
  <div class="mx-auto mb-8 max-w-2xl text-center md:mb-12">
    <h2 class="text-2xl font-bold tracking-tight text-gray-900 md:text-3xl">
      Find Your Favourite Brand
    </h2>

    <p class="mt-2 text-sm text-gray-500 md:text-base">
      Explore cars from your favourite automobile brands
    </p>
  </div>
  <!-- End Title -->


  <!-- Brands Grid -->
  <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">

    @for (brand of brands(); track brand.brandId) {


      <a
        [routerLink]="['/models', brand.brandId]"
        class="group flex min-h-[190px] flex-col items-center justify-between
               rounded-2xl border border-gray-200 bg-white p-5
               shadow-sm transition-all duration-200
               hover:-translate-y-1 hover:border-gray-300 hover:shadow-lg"
      >

       

        <!-- Logo Container -->
        <div
          class="flex h-28 w-full items-center justify-center
                 rounded-xl bg-gray-50 p-4
                 transition-colors duration-200
                 group-hover:bg-gray-100"
        >
           
          <img
            [src]="brand.logoUrl"
            [alt]="brand.brandName"
            class="max-h-20 max-w-[140px] object-contain
                   transition-transform duration-200
                   group-hover:scale-105"
          >

        </div>


        <!-- Brand Name -->
        <div class="mt-5 text-center">

          <h3
            class="text-base font-semibold text-gray-900
                   transition-colors group-hover:text-gray-700"
          >
            {{ brand.brandName }}
          </h3>

          <p
            class="mt-1 text-xs text-gray-400
                   opacity-0 transition-opacity duration-200
                   group-hover:opacity-100"
          >
            View models →
          </p>

        </div>

      </a>

    }

  </div>

</div>
