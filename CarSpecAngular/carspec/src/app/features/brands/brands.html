@if (authService.isloggedout(); as success) {

  <div
    class="fixed top-5 right-5 z-[10000]
           w-[360px]
           rounded-xl
           border border-green-200
           bg-white
           p-4
           shadow-2xl
           animate-[slideIn_0.3s_ease-out]"
  >

    <div class="flex items-start gap-3">

      <!-- Success Icon -->
      <div
        class="flex h-10 w-10 shrink-0
               items-center justify-center
               rounded-full
               bg-green-100
               text-green-600"
      >
        ✓
      </div>

      <!-- Success Content -->
      <div class="flex-1">

        <h3 class="text-sm font-semibold text-gray-900">
          Success
        </h3>

        <p class="mt-1 text-sm text-gray-600">
          Logged out
        </p>

      </div>

      <!-- Close -->
      <button
        type="button"
        (click)="authService.isloggedout.set(false)"
        class="text-gray-400 transition-colors
               hover:text-gray-700"
      >
        ✕
      </button>

    </div>

  </div>

}

<div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8 lg:py-14">

  <!-- Title -->
  <div class="mx-auto mb-8 max-w-2xl text-center md:mb-12">
    <h2 class="text-2xl font-bold tracking-tight text-gray-900 md:text-3xl">
      Find Your Favourite Brand
    </h2>

    <p class="mt-2 text-sm text-gray-500 md:text-base">
      Explore cars from your favourite automobile brands
    </p>
  </div>
  <!-- End Title -->


  <!-- Brands Grid -->
  <!-- Brands Grid -->
<div class="grid grid-cols-3 gap-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7">

  @for (brand of brands(); track brand.brandId) {

    <a
      [routerLink]="['/models', brand.brandId]"
      class="group flex min-h-[145px] flex-col items-center justify-between
             rounded-xl border border-gray-200 bg-white p-3
             shadow-sm transition-all duration-200
             hover:-translate-y-1 hover:border-gray-300 hover:shadow-md"
    >

      <!-- Logo Container -->
      <div
        class="flex h-20 w-full items-center justify-center
               rounded-lg bg-gray-50 p-2.5
               transition-colors duration-200
               group-hover:bg-gray-100"
      >

        <img
          [src]="brand.logoUrl"
          [alt]="brand.brandName"
          class="max-h-14 max-w-[100px] object-contain
                 transition-transform duration-200
                 group-hover:scale-105"
        >

      </div>


      <!-- Brand Name -->
      <div class="mt-3 text-center">

        <h3
          class="text-sm font-semibold text-gray-900
                 transition-colors group-hover:text-gray-700"
        >
          {{ brand.brandName }}
        </h3>

        <p
          class="mt-0.5 text-[10px] text-gray-400
                 opacity-0 transition-opacity duration-200
                 group-hover:opacity-100"
        >
          View models →
        </p>

      </div>

    </a>

  }

</div>

</div>
