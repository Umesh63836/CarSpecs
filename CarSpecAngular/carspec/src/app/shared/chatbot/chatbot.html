<!-- ========================= -->
<!-- Chat Window -->
<!-- ========================= -->

@if (isOpen()) {

  <div
    class="
      fixed z-[9990]

      /* Mobile position */
      bottom-28 right-10

      /* Mobile size */
      h-[416px] w-[288px]

      /* Desktop */
      sm:bottom-36 sm:right-20
      sm:h-[520px] sm:w-[360px]

      flex flex-col
      overflow-hidden
      rounded-2xl
      border border-gray-200
      bg-white
      shadow-2xl
    "
  >

    <!-- Header -->
    <div
      class="
        flex items-center justify-between
        bg-black
        px-3 py-2.5
        text-white
        sm:px-4 sm:py-3
      "
    >

      <div class="flex items-center gap-2 sm:gap-3">

        <!-- Logo -->
        <div
          class="
            flex h-8 w-8 shrink-0
            items-center justify-center
            rounded-full
            bg-red-500
            text-sm font-bold
            sm:h-9 sm:w-9 sm:text-base
          "
        >
          C
        </div>

        <!-- Title -->
        <div>
          <div class="text-sm font-semibold sm:text-base">
            CarsSpec. AI
          </div>

          <div class="text-[10px] text-gray-300 sm:text-xs">
            Powered by AI, built for car enthusiasts
          </div>
        </div>

      </div>

      <!-- Close -->
      <button
        type="button"
        (click)="switchChat()"
        class="
          text-lg leading-none
          text-gray-300
          transition
          hover:text-white
          sm:text-xl
        "
      >
        ×
      </button>

    </div>


    <!-- Messages -->
    <div
      class="
        flex-1
        space-y-2
        overflow-y-auto
        bg-gray-50
        p-3
        sm:space-y-3
        sm:p-4
      "
    >

      @for (message of messages(); track $index) {

        <!-- User -->
        @if (message.role === 'user') {

          <div class="flex justify-end">

            <div
              class="
                max-w-[82%]
                whitespace-pre-wrap
                rounded-2xl rounded-br-md
                bg-black
                px-3 py-2
                text-xs leading-relaxed
                text-white
                sm:max-w-[80%]
                sm:px-4 sm:py-2
                sm:text-sm
              "
            >
              {{ message.content }}
            </div>

          </div>

        }

        <!-- AI -->
        @else {

          <div class="flex justify-start">

            <div
              class="
                max-w-[92%]
                rounded-2xl rounded-bl-md
                bg-white
                px-3 py-2.5
                text-xs leading-relaxed
                text-gray-800
                shadow-sm
                sm:max-w-[90%]
                sm:px-4 sm:py-3
                sm:text-sm
              "
            >

              <markdown
                [data]="message.content"
                class="ai-markdown block"
              ></markdown>

            </div>

          </div>

        }

      }


      <!-- Loading -->
      @if (isLoading()) {

        <div class="flex justify-start">

          <div
            class="
              flex items-center gap-2
              rounded-2xl rounded-bl-md
              bg-white
              px-3 py-2.5
              text-xs text-gray-500
              shadow-sm
              sm:px-4 sm:py-3
              sm:text-sm
            "
          >

            <span class="flex gap-1">

              <span
                class="
                  h-1.5 w-1.5
                  animate-bounce
                  rounded-full
                  bg-gray-400
                "
              ></span>

              <span
                class="
                  h-1.5 w-1.5
                  animate-bounce
                  rounded-full
                  bg-gray-400
                  [animation-delay:150ms]
                "
              ></span>

              <span
                class="
                  h-1.5 w-1.5
                  animate-bounce
                  rounded-full
                  bg-gray-400
                  [animation-delay:300ms]
                "
              ></span>

            </span>

            Thinking...

          </div>

        </div>

      }

    </div>


    <!-- Input -->
    <div
      class="
        border-t border-gray-200
        bg-white
        p-2.5
        sm:p-3
      "
    >

      <div class="flex items-end gap-2">

        <textarea
          [(ngModel)]="userMessage"
          (keydown.enter)="$event.preventDefault(); onEnter()"
          rows="1"
          placeholder="Ask about a car..."
          class="
            max-h-20 min-h-9
            flex-1 resize-none
            rounded-xl
            border border-gray-300
            bg-white
            px-3 py-2
            text-xs text-gray-800
            outline-none
            transition
            placeholder:text-gray-400
            focus:border-black
            focus:ring-1 focus:ring-black
            sm:max-h-24
            sm:min-h-10
            sm:text-sm
          "
        ></textarea>

        <button
          type="button"
          (click)="sendMessage()"
          [disabled]="!userMessage.trim() || isLoading()"
          class="
            flex h-9 w-9 shrink-0
            items-center justify-center
            rounded-xl
            bg-red-500
            text-base font-semibold
            text-white
            transition
            hover:bg-red-600
            disabled:cursor-not-allowed
            disabled:opacity-50
            sm:h-10 sm:w-10
            sm:text-lg
          "
        >
          ↑
        </button>

      </div>

    </div>

  </div>

}


<!-- ========================= -->
<!-- Floating Button -->
<!-- ========================= -->

<div
  class="
    fixed z-[9991]

    /* Mobile position */
    bottom-14 right-10

    /* Desktop position */
    sm:bottom-20 sm:right-20

    flex items-center gap-2
  "
>

  @if (!isOpen()) {

    <span
      class="
        rounded-full
        bg-white
        px-2.5 py-1.5
        text-xs font-semibold
        text-gray-800
        shadow-md
        ring-1 ring-gray-100
        sm:px-3 sm:py-2
        sm:text-sm
      "
    >
      Ask CarsSpec. AI
    </span>

  }

  <button
    type="button"
    (click)="switchChat()"
    class="
      flex h-12 w-12 shrink-0
      items-center justify-center
      rounded-full
      bg-red-500
      text-lg font-bold
      text-white
      shadow-xl
      transition duration-300
      hover:scale-110
      hover:bg-red-600
      sm:h-14 sm:w-14
      sm:text-xl
    "
  >
    C
  </button>

</div>
