<!-- Chatbot container -->
<div class="fixed bottom-33 right-20 z-[9990]">

  <!-- Chat window -->
  @if (isOpen()) {

    <div
      class="
        mb-4
        flex
        h-[520px]
        w-[360px]
        flex-col
        overflow-hidden
        rounded-2xl
        border
        border-gray-200
        bg-white
        shadow-2xl
      "
    >

      <!-- Header -->
      <div
        class="
          flex
          items-center
          justify-between
          bg-black
          px-4
          py-3
          text-white
        "
      >

        <div class="flex items-center gap-3">

          <div
            class="
              flex
              h-9
              w-9
              items-center
              justify-center
              rounded-full
              bg-red-500
              font-bold
            "
          >
            C
          </div>

          <div>
            <div class="font-semibold">
              CarsSpec. AI
            </div>

            <div class="text-xs text-gray-300">
              Powered by AI, built for car enthusiasts
            </div>
          </div>

        </div>

        <button
          type="button"
          (click)="switchChat()"
          class="
            text-xl
            text-gray-300
            transition
            hover:text-white
          "
        >
          ×
        </button>

      </div>


      <!-- Messages -->
      <div
        class="
          flex-1
          space-y-3
          overflow-y-auto
          bg-gray-50
          p-4
        "
      >

        @for (message of messages(); track $index) {

          @if (message.role === 'user') {

            <!-- User message -->
            <div class="flex justify-end">

              <div
                class="
                  max-w-[80%]
                  rounded-2xl
                  rounded-br-md
                  bg-black
                  px-4
                  py-2
                  text-sm
                  text-white
                "
              >
                {{ message.content }}
              </div>

            </div>

          } @else {

            <!-- AI message -->
            <div class="flex justify-start">

              <div
                class="
                  max-w-[80%]
                  rounded-2xl
                  rounded-bl-md
                  bg-white
                  px-4
                  py-2
                  text-sm
                  text-gray-800
                  shadow-sm
                "
              >
                {{ message.content }}
              </div>

            </div>

          }

        }

        @if (isLoading()) {

          <div class="flex justify-start">

            <div
              class="
                rounded-2xl
                rounded-bl-md
                bg-white
                px-4
                py-3
                text-sm
                text-gray-500
                shadow-sm
              "
            >
              Thinking...
            </div>

          </div>

        }

      </div>


      <!-- Input -->
      <div
        class="
          border-t
          border-gray-200
          bg-white
          p-3
        "
      >

        <div class="flex items-end gap-2">

          <textarea
            [(ngModel)]="userMessage"
            (keydown.enter)="$event.preventDefault(); onEnter()"
            rows="1"
            placeholder="Ask about a car..."
            class="
              max-h-24
              min-h-10
              flex-1
              resize-none
              rounded-xl
              border
              border-gray-300
              px-3
              py-2
              text-sm
              outline-none
              transition
              focus:border-black
              focus:ring-1
              focus:ring-black
            "
          ></textarea>

          <button
            type="button"
            (click)="sendMessage()"
            [disabled]="!userMessage.trim() || isLoading()"
            class="
              flex
              h-10
              w-10
              items-center
              justify-center
              rounded-xl
              bg-red-500
              text-white
              transition
              hover:bg-red-600
              disabled:cursor-not-allowed
              disabled:opacity-50
            "
          >
            ↑
          </button>

        </div>

      </div>

    </div>

  }


  <!-- Floating chatbot button -->
  <div
    class="
      fixed
      bottom-20
      right-20
      z-[9991]
      flex
      items-center
      gap-2
    "
  >
    
        <!-- Ask CarSpec AI animated text -->
        @if (!isOpen()) {
      <span
        class="
          ask-ai-label
          rounded-full
          bg-white
          px-3
          py-2
          text-sm
          font-semibold
          text-gray-800
          shadow-md
          ring-1
          ring-gray-100
        "
      >
        Ask CarsSpec. AI
      </span>
    }


    <!-- Floating chatbot button -->
    <button
      type="button"
      (click)="switchChat()"
      class="
        flex
        h-14
        w-14
        items-center
        justify-center
        rounded-full
        bg-red-500
        text-xl
        font-bold
        text-white
        shadow-xl
        transition
        duration-300
        hover:scale-110
        hover:bg-red-600
      "
    >
      C
    </button>

  </div>

</div>
